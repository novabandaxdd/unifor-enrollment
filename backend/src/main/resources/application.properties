# ============================================================
# Unifor Enrollment Backend — Application Properties
# ============================================================

# --- Application info ---
quarkus.application.name=unifor-enrollment-backend
quarkus.application.version=1.0.0-SNAPSHOT

# --- HTTP ---
quarkus.http.port=8080

# --- Datasource ---
# Values here are defaults for local dev; Docker overrides via environment variables.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/unifor_db
quarkus.datasource.username=unifor
quarkus.datasource.password=unifor_pass

# --- Hibernate ORM ---
# The schema is managed by infra/postgres/init.sql (Docker init),
# so we only validate — never drop or create from Hibernate.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- OIDC ---
# auth-server-url is overridden via env var in Docker (http://keycloak:8080/realms/unifor)
quarkus.oidc.auth-server-url=http://localhost:8180/realms/unifor
quarkus.oidc.client-id=unifor-backend
quarkus.oidc.credentials.secret=unifor-backend-secret
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=any

# --- OpenAPI / Swagger ---
quarkus.smallrye-openapi.info-title=Unifor Enrollment API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Academic enrollment REST API — Unifor Technical Challenge
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- CORS (allow Angular dev server) ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."br.unifor".level=DEBUG

# ============================================================
# Dev profile overrides (%dev.)
# ============================================================
%dev.quarkus.oidc.enabled=false
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.log.level=DEBUG

# ============================================================
# Test profile overrides (%test.)
# ============================================================
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# ============================================================
# Prod profile overrides (%prod.)
# ============================================================
# Schema is managed externally (infra/postgres/init.sql via Docker).
# Never drop or seed in production.
%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file
