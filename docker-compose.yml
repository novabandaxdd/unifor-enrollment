services:

  postgres:
    image: postgres:16-alpine
    container_name: unifor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unifor_db
      POSTGRES_USER: unifor
      POSTGRES_PASSWORD: unifor_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifor -d unifor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: unifor-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/realms/unifor || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unifor-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Datasource
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/unifor_db
      QUARKUS_DATASOURCE_USERNAME: unifor
      QUARKUS_DATASOURCE_PASSWORD: unifor_pass
      # Hibernate
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: validate
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: no-file
      # OIDC
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/unifor
      QUARKUS_OIDC_CLIENT_ID: unifor-backend
      QUARKUS_OIDC_CREDENTIALS_SECRET: unifor-backend-secret
      QUARKUS_OIDC_TLS_VERIFICATION: none
      # CORS
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:4200
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      # Logging
      QUARKUS_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unifor-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
